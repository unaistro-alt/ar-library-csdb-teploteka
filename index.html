<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen — Fixed</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div class="arjs-loader">Наведи на маркер...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-assets timeout="30000">
        <video id="my-video"
               src="SnowQween.mp4"
               autoplay loop muted playsinline
               crossorigin="anonymous"></video>
      </a-assets>

      <!-- Маркер Hiro: видео-фон ЗА спиной Королевы, оба двигаются вместе -->
      <a-marker preset="hiro" emitevents="true">
        <!-- вертикальная видео-плоскость позади модели -->
        <a-video src="#my-video" width="2" height="3.5" position="0 1.2 -1.5"></a-video>
        <!-- Королева -->
        <a-entity gltf-model="url(SnowQween.glb)" scale="0.5 0.5 0.5"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // прячем заглушку, когда сцена готова
      document.querySelector('a-scene').addEventListener('loaded', function () {
        var l = document.querySelector('.arjs-loader');
        if (l) l.style.display = 'none';
      });
    </script>
  </body>
</html>
