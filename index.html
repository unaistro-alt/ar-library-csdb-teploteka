<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen — Fixed</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- aframe-extras 6.x: совместим с A-Frame 1.4.0, содержит animation-mixer -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
        z-index: 999;
        pointer-events: none; /* не блокирует тапы, даже если зависнет */
      }
    </style>
  </head>
  <body>
    <div class="arjs-loader">Наведи на маркер...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-assets timeout="30000">
        <video id="my-video"
               src="SnowQween.mp4"
               autoplay loop muted playsinline
               crossorigin="anonymous"></video>
      </a-assets>

      <a-marker preset="hiro" emitevents="true">
        <a-video src="#my-video" width="2" height="3.5" position="0 1.2 -1.5"></a-video>
        <a-entity
          gltf-model="url(SnowQweenAnimation.glb)"
          animation-mixer="clip: *; loop: repeat"
          scale="2 2 2">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      function hideLoader() {
        var l = document.querySelector('.arjs-loader');
        if (l) l.style.display = 'none';
      }

      // 1. AR.js даёт событие, когда видео с камеры реально стартовало
      window.addEventListener('arjs-video-loaded', hideLoader);

      // 2. Страховка: если событие не пришло (или сцена уже была готова),
      //    прячем заглушку по таймауту в любом случае
      setTimeout(hideLoader, 4000);
    </script>
  </body>
</html>
