<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen - Video Fixed</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
      }
      .no-camera-msg {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        text-align: center; color: #333; font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="no-camera" class="no-camera-msg" style="display:none;">
      AR недоступен на этом устройстве (нет камеры)<br>
      Открой на телефоне.
    </div>
    <div class="arjs-loader">Наведи камеру на маркер Hiro</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-assets>
        <!-- Объявляем видео в assets — это обязательно для AR -->
        <video
          id="bg-video"
          src="SnowQween.mp4"
          loop="true"
          autoplay="true"
          playsinline
          webkit-playsinline
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-marker preset="hiro" vidhandler>
        <!-- Королева -->
        <a-entity gltf-model="SnowQween.glb" scale="1.5 1.5 1.5" position="0 0 0"></a-entity>

        <!-- Плоскость с видео (ссылка на #bg-video) -->
        <a-plane
          width="10.0"
          height="15.0"
          position="0 2.5 -5.0"
          rotation="0 0 0"
          material="shader: flat; src: #bg-video">
        </a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Компонент, который включает/выключает видео при обнаружении маркера
      AFRAME.registerComponent('vidhandler', {
        init: function () {
          this.toggle = false;
          this.vid = document.querySelector('#bg-video');
          if (this.vid) {
            this.vid.pause();
            this.vid.currentTime = 0;
          }
        },
        tick: function () {
          const markerVisible = this.el.object3D.visible;
          if (markerVisible) {
            if (!this.toggle) {
              this.toggle = true;
              if (this.vid) {
                this.vid.play().catch(e => console.log('Video play error:', e));
              }
            }
          } else {
            this.toggle = false;
            if (this.vid) {
              this.vid.pause();
              this.vid.currentTime = 0;
            }
          }
        }
      });

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById('no-camera').style.display = 'block';
        const loader = document.querySelector('.arjs-loader');
        if (loader) loader.style.display = 'none';
      }
    </script>
  </body>
</html>
