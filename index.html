<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen — Fixed</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="arjs-loader">Наведи на маркер...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">
      
      <!-- Маркер Hiro: модель строго внутри -->
      <a-marker preset="hiro">
        <a-entity gltf-model="url(SnowQween.glb)" scale="0.5 0.5 0.5"></a-entity>
      </a-marker>

      <!-- Видео-фон (плоскость с видео за Королевой) -->
      <a-entity video-shader="src: #my-video; color: #000;" scale="2 2 2" position="0 0 -1"></a-entity>
      <video id="my-video" src="SnowQween.mp4" autoplay loop muted playsinline></video>

    </a-scene>
  </body>
</html>
