<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen with Video Background</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- AR.js (стабильный CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-ar@1.3.x/dist/aframe-ar.min.js"></script>
    <!-- Компонент для видео-текстуры (обязательно!) -->
    <script src="https://unpkg.com/aframe-video-shader@1.0.3/dist/aframe-video-shader.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
      }
    </style>
  </head>
  <body>

    <div class="arjs-loader">Загрузка AR и видео...</div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" 
             renderer="colorManagement: true; physicallyCorrectLights: true;">
      
      <!-- Вертикальная плоскость с видео ЗА королевой -->
      <a-plane 
        id="video-plane"
        src="SnowQween.mp4"
        width="2.5"
        height="3.5"
        position="-0.2 0 -3.5" 
        rotation="0 0 0"
        side="double"
        video-shader>
        <!-- autoplay loop muted — обязательно для автовоспроизведения в браузерах -->
        <video id="my-video" src="SnowQween.mp4" autoplay loop muted playsinline></video>
      </a-plane>
