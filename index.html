<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin : 0px; overflow: hidden;">
    <a-scene arjs="sourceType: webcam; debugUIEnabled: false">
      <!-- Hiro — это встроенный маркер. Камера ищет его узор. -->
      <a-marker preset="hiro">
        <!-- Сюда мы поставим Курчатова. Пока вместо него — цветной куб, чтобы сразу проверить. -->
        <a-box position="0 0.5 0" rotation="0 45 0" color="#4CC3D9" scale="0.5 0.5 0.5"></a-box>
      </a-marker>
      <a-entity camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
