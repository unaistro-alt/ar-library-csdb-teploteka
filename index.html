<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>AR Snow Queen — Fixed</title>

    <!-- Живые источники (проверены на твоём телефоне) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <!-- animation-mixer для проигрывания анимации из GLB -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      .arjs-loader {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); color: #fff; font-family: monospace;
        display: flex; justify-content: center; align-items: center;
        z-index: 999;
      }
      #my-video {
        position: absolute;
        width: 1px; height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #err-box {
        position: absolute; top: 0; left: 0;
        max-width: 100%;
        background: rgba(200,0,0,0.85); color: #fff;
        font-family: monospace; font-size: 12px;
        padding: 8px; z-index: 9999;
        white-space: pre-wrap; word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="err-box" style="display:none"></div>
    <div class="arjs-loader">Наведи на маркер...</div>

    <a-scene embedded
             arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">

      <a-assets timeout="30000">
        <!-- ВИДЕО: замени ССЫЛКА_НА_ВИДЕО.mp4 на прямой адрес твоего MP4-файла -->
        <video id="my-video"
               src="SnowQween.mp4"
               autoplay loop muted playsinline
               crossorigin="anonymous"></video>
        <a-asset-item id="queen" src="SnowQweenAnimation.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro" emitevents="true">
        <a-video src="#my-video" width="2" height="3.5" position="0 1.2 -1.5"></a-video>
        <a-entity gltf-model="#queen"
                  animation-mixer="clip: *; loop: repeat"
                  scale="2 2 2"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      var errBox = document.getElementById('err-box');
      function showErr(msg) {
        errBox.style.display = 'block';
        errBox.textContent += msg + '\n';
      }
      window.onerror = function (msg, src, line) {
        showErr('ОШИБКА: ' + msg + ' (' + src + ':' + line + ')');
      };
      window.addEventListener('unhandledrejection', function (e) {
        showErr('ОТКАЗ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });

      function hideLoader() {
        var l = document.querySelector('.arjs-loader');
        if (l) l.style.display = 'none';
      }
      document.querySelector('a-scene').addEventListener('loaded', hideLoader);
      window.addEventListener('arjs-video-loaded', function () {
        console.log('Камера запустилась');
        hideLoader();
      });
      setTimeout(hideLoader, 5000);
    </script>
  </body>
</html>
