<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Поиск живого CDN</title>
    <script>
      function mark(text, ok) {
        var d = document.createElement('div');
        d.style.cssText = 'font-size:18px;padding:6px;font-family:sans-serif;color:' + (ok ? '#0a7d0a' : '#b00020');
        d.textContent = (ok ? 'OK: ' : 'НЕ ЗАГРУЗИЛОСЬ: ') + text;
        document.body.appendChild(d);
      }
    </script>
  </head>
  <body style="margin:10px; background:#fff;">
    <h3>Проверка CDN для A-Frame:</h3>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.0/aframe.min.js"
            onload="mark('Вариант 1: cdnjs', true)"
            onerror="mark('Вариант 1: cdnjs', false)"></script>
    <script src="https://unpkg.com/aframe@1.4.0/dist/aframe.min.js"
            onload="mark('Вариант 2: unpkg', true)"
            onerror="mark('Вариант 2: unpkg', false)"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.0/dist/aframe.min.js"
            onload="mark('Вариант 3: jsDelivr', true)"
            onerror="mark('Вариант 3: jsDelivr', false)"></script>
    <script>
      window.addEventListener('load', function() {
        if (window.AFRAME) { mark('AFRAME готов, версия ' + AFRAME.version, true); }
        else { mark('AFRAME так и не определился', false); }
      });
    </script>
  </body>
</html>
