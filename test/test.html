<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Тест камеры</title>
    <style>
      body { margin: 0; background: #111; color: #fff; font-family: sans-serif; }
      #log { padding: 12px; font-size: 15px; white-space: pre-wrap; }
      #btn { margin: 12px; padding: 14px 20px; font-size: 17px; }
      video { width: 100%; max-width: 480px; display: block; margin: 10px; }
    </style>
  </head>
  <body>
    <button id="btn">Проверить камеру</button>
    <video id="video" autoplay playsinline muted></video>
    <div id="log">Жду нажатия кнопки…</div>

    <script>
      var log = function(t) {
        document.getElementById('log').textContent += '\n' + t;
      };
      document.getElementById('btn').onclick = function() {
        log('Пробую включить камеру…');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          log('ОШИБКА: getUserMedia не поддерживается этим браузером');
          return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
          .then(function(stream) {
            log('КАМЕРА ВКЛЮЧИЛАСЬ! Ниже должно быть живое видео.');
            document.getElementById('video').srcObject = stream;
          })
          .catch(function(err) {
            log('ОШИБКА КАМЕРЫ: ' + err.name + ' — ' + err.message);
          });
      };
    </script>
  </body>
</html>
